name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm run validate
      - run: npm pack --dry-run
