name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm run validate
      - run: npm pack --dry-run

  lane-evidence:
    name: DSH ${{ matrix.dsh }} (${{ matrix.claim }})
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.claim == 'preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.1.1-rc.2
            claim: blocking
          - dsh: 0.1.2-alpha.2
            claim: preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - uses: pnpm/setup@v2
        with:
          version: '11.7.0'
          install: false
      - name: Install exact DSH lane without lifecycle scripts
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "dsh-${{ matrix.dsh }}"
          $store = Join-Path $env:RUNNER_TEMP 'pnpm-store'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          pnpm --dir $runtime --store-dir $store add --ignore-scripts --save-exact "@deepseek-ai/dsh@${{ matrix.dsh }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Record exact-lane capability evidence
        shell: pwsh
        run: |
          $dsh = Join-Path $env:DSH_RUNTIME "node_modules/.bin/dsh.cmd"
          $evidence = Join-Path $env:RUNNER_TEMP "dsh-capabilities-${{ matrix.dsh }}.json"
          node bin/dsh-developer.js capabilities --dsh $dsh --json | Tee-Object -FilePath $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-capabilities-${{ matrix.dsh }}
          path: ${{ runner.temp }}/dsh-capabilities-${{ matrix.dsh }}.json
          if-no-files-found: warn
          retention-days: 14

  product-matrix:
    name: Product release-to-preview matrix
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - uses: pnpm/setup@v2
        with:
          version: '11.7.0'
          install: false
      - name: Install exact release and preview lanes
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'dsh-release'
          $preview = Join-Path $env:RUNNER_TEMP 'dsh-preview'
          $store = Join-Path $env:RUNNER_TEMP 'pnpm-store'
          New-Item -ItemType Directory -Force -Path $release, $preview | Out-Null
          pnpm --dir $release --store-dir $store add --ignore-scripts --save-exact '@deepseek-ai/dsh@0.1.1-rc.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir $preview --store-dir $store add --ignore-scripts --save-exact '@deepseek-ai/dsh@0.1.2-alpha.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DSH_PREVIEW=$preview" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise this plugin across both lanes
        shell: pwsh
        run: |
          $releaseDsh = Join-Path $env:DSH_RELEASE 'node_modules/.bin/dsh.cmd'
          $previewDsh = Join-Path $env:DSH_PREVIEW 'node_modules/.bin/dsh.cmd'
          $preflightCases = @(
            @{ Lane = 'release'; Profile = 'headless'; Dsh = $releaseDsh; Blocking = $true },
            @{ Lane = 'release'; Profile = 'web'; Dsh = $releaseDsh; Blocking = $true },
            @{ Lane = 'preview'; Profile = 'headless'; Dsh = $previewDsh; Blocking = $false },
            @{ Lane = 'preview'; Profile = 'web'; Dsh = $previewDsh; Blocking = $false }
          )
          foreach ($case in $preflightCases) {
            $preflight = Join-Path $env:RUNNER_TEMP "dsh-profile-preflight-$($case.Lane)-$($case.Profile).json"
            node bin/dsh-developer.js preflight --source . --profile $case.Profile --dsh $case.Dsh --json | Tee-Object -FilePath $preflight
            $exitCode = $LASTEXITCODE
            if ($case.Blocking -and $exitCode -ne 0) { exit $exitCode }
            if (-not $case.Blocking -and $exitCode -ne 0) {
              Write-Output "::warning::The advisory $($case.Lane) $($case.Profile) profile preflight failed; inspect the uploaded evidence."
            }
          }
          $impact = Join-Path $env:RUNNER_TEMP 'dsh-upstream-impact.json'
          node bin/dsh-developer.js impact --source . --release-dsh $releaseDsh --preview-dsh $previewDsh --json | Tee-Object -FilePath $impact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Join-Path $env:RUNNER_TEMP 'dsh-compatibility-matrix.json'
          node bin/dsh-developer.js compatibility --source . --release-dsh $releaseDsh --preview-dsh $previewDsh --json | Tee-Object -FilePath $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Raw $evidence | ConvertFrom-Json
          $preview = $report.lanes | Where-Object { $_.id -eq 'preview' }
          if (-not $preview.ok) { Write-Output '::warning::The advisory DSH preview lifecycle failed; inspect the uploaded matrix.' }
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-compatibility-matrix
          path: |
            ${{ runner.temp }}/dsh-profile-preflight-*.json
            ${{ runner.temp }}/dsh-upstream-impact.json
            ${{ runner.temp }}/dsh-compatibility-matrix.json
          if-no-files-found: error
          retention-days: 14
