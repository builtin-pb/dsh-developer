name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
      - run: npm run validate
        env:
          DSH_DEVELOPER_PROCESS_TEST: '1'
      - name: Linux exclusive rename failure checks
        if: runner.os == 'Linux'
        run: node --test test/exclusive-rename.test.js
        env:
          DSH_DEVELOPER_LINUX_RENAME_TEST: '1'
      - run: npm pack --dry-run

  lane-evidence:
    name: DSH ${{ matrix.dsh }} (${{ matrix.claim }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.claim == 'preview' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        dsh: [0.1.5-rc.2, 0.1.6-alpha.1]
        include:
          - dsh: 0.1.5-rc.2
            claim: blocking
          - dsh: 0.1.6-alpha.1
            claim: preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
      - uses: pnpm/setup@v2
        with:
          version: '11.7.0'
          install: false
      - name: Install exact DSH lane without lifecycle scripts
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "dsh-${{ matrix.dsh }}"
          $store = Join-Path $env:RUNNER_TEMP 'pnpm-store'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item ".github/dsh-runtimes/${{ matrix.dsh }}/package.json", ".github/dsh-runtimes/${{ matrix.dsh }}/pnpm-lock.yaml" -Destination $runtime
          pnpm --dir $runtime --store-dir $store install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check integration against this DSH lane's declarations
        shell: pwsh
        run: |
          npm run typecheck -- --runtime $env:DSH_RUNTIME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact-lane capability evidence
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "dsh.cmd" } else { "dsh" }
          $dsh = Join-Path $env:DSH_RUNTIME "node_modules/.bin/$bin"
          $evidence = Join-Path $env:RUNNER_TEMP "dsh-capabilities-${{ matrix.dsh }}.json"
          node bin/dsh-developer.js capabilities --dsh $dsh --json 2>&1 | Tee-Object -FilePath $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-capabilities-${{ matrix.dsh }}-${{ matrix.os }}
          path: ${{ runner.temp }}/dsh-capabilities-${{ matrix.dsh }}.json
          if-no-files-found: warn
          retention-days: 14

  product-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: Product release-to-preview matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
      - uses: pnpm/setup@v2
        with:
          version: '11.7.0'
          install: false
      - name: Install exact release and preview lanes
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'dsh-release'
          $preview = Join-Path $env:RUNNER_TEMP 'dsh-preview'
          $store = Join-Path $env:RUNNER_TEMP 'pnpm-store'
          New-Item -ItemType Directory -Force -Path $release, $preview | Out-Null
          Copy-Item '.github/dsh-runtimes/0.1.5-rc.2/package.json', '.github/dsh-runtimes/0.1.5-rc.2/pnpm-lock.yaml' -Destination $release
          Copy-Item '.github/dsh-runtimes/0.1.6-alpha.1/package.json', '.github/dsh-runtimes/0.1.6-alpha.1/pnpm-lock.yaml' -Destination $preview
          pnpm --dir $release --store-dir $store install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir $preview --store-dir $store install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DSH_RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DSH_PREVIEW=$preview" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise this plugin across both lanes
        shell: pwsh
        run: |
          $bin = if ($IsWindows) { "dsh.cmd" } else { "dsh" }
          $releaseDsh = Join-Path $env:DSH_RELEASE "node_modules/.bin/$bin"
          $previewDsh = Join-Path $env:DSH_PREVIEW "node_modules/.bin/$bin"
          $preflightCases = @(
            @{ Lane = 'release'; Profile = 'headless'; Dsh = $releaseDsh; Blocking = $true },
            @{ Lane = 'release'; Profile = 'web'; Dsh = $releaseDsh; Blocking = $true },
            @{ Lane = 'preview'; Profile = 'headless'; Dsh = $previewDsh; Blocking = $false },
            @{ Lane = 'preview'; Profile = 'web'; Dsh = $previewDsh; Blocking = $false },
            @{ Lane = 'preview'; Profile = 'acp'; Dsh = $previewDsh; Blocking = $false }
          )
          foreach ($case in $preflightCases) {
            $preflight = Join-Path $env:RUNNER_TEMP "dsh-profile-preflight-$($case.Lane)-$($case.Profile).json"
            node bin/dsh-developer.js preflight --source . --profile $case.Profile --dsh $case.Dsh --json 2>&1 | Tee-Object -FilePath $preflight
            $exitCode = $LASTEXITCODE
            if ($case.Blocking -and $exitCode -ne 0) { exit $exitCode }
            if (-not $case.Blocking -and $exitCode -ne 0) {
              Write-Output "::warning::The advisory $($case.Lane) $($case.Profile) profile preflight failed; inspect the uploaded evidence."
            }
          }
          $impact = Join-Path $env:RUNNER_TEMP 'dsh-upstream-impact.json'
          node bin/dsh-developer.js impact --source . --release-dsh $releaseDsh --preview-dsh $previewDsh --json 2>&1 | Tee-Object -FilePath $impact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DSH_DEVELOPER_DELEGATION_DSH_TEST = '1'
          $env:DSH_DEVELOPER_RELEASE_DSH = $releaseDsh
          $env:DSH_DEVELOPER_PREVIEW_DSH = $previewDsh
          node --test --test-reporter=spec test/delegation-safety.integration.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DSH_DEVELOPER_SUBAGENT_CONTRACT_TEST = '1'
          node --test test/capabilities.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DSH_DEVELOPER_CLIENT_CORPUS_ROOTS = (Join-Path $env:DSH_RELEASE 'node_modules/.pnpm') + [IO.Path]::PathSeparator + (Join-Path $env:DSH_PREVIEW 'node_modules/.pnpm')
          node --test test/client-bundle-corpus.integration.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Join-Path $env:RUNNER_TEMP 'dsh-compatibility-matrix.json'
          node bin/dsh-developer.js compatibility --source . --release-dsh $releaseDsh --preview-dsh $previewDsh --json 2>&1 | Tee-Object -FilePath $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content -Raw $evidence | ConvertFrom-Json
          $preview = $report.lanes | Where-Object { $_.id -eq 'preview' }
          if (-not $preview.ok) { Write-Output '::warning::The advisory DSH preview lifecycle failed; inspect the uploaded matrix.' }
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dsh-compatibility-matrix-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dsh-profile-preflight-*.json
            ${{ runner.temp }}/dsh-upstream-impact.json
            ${{ runner.temp }}/dsh-compatibility-matrix.json
          if-no-files-found: error
          retention-days: 14

  development:
    name: Native development DSH ${{ matrix.dsh }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.dsh == 'alpha' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        dsh: [latest, next, alpha]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - uses: pnpm/setup@v2
        with:
          version: '11.7.0'
          install: false
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: examples/package-check
      - run: node bin/dsh-developer.js run --source examples/package-check --script test
      - run: npm ci --ignore-scripts
        if: matrix.dsh == 'next'
        working-directory: examples/session-status
      - run: node bin/dsh-developer.js run --source examples/session-status --script test
        if: matrix.dsh == 'next'
      - name: Verify real package-manager argument forwarding
        if: matrix.dsh == 'next'
        shell: pwsh
        run: |
          $env:DSH_DEVELOPER_YARN_CLASSIC_ROOT = Join-Path $env:RUNNER_TEMP 'yarn-classic'
          $env:DSH_DEVELOPER_YARN_MODERN_ROOT = Join-Path $env:RUNNER_TEMP 'yarn-modern'
          npm install --prefix $env:DSH_DEVELOPER_YARN_CLASSIC_ROOT --ignore-scripts yarn@1.22.22
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix $env:DSH_DEVELOPER_YARN_MODERN_ROOT --ignore-scripts '@yarnpkg/cli-dist@4.18.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DSH_DEVELOPER_PNPM_TEST = '1'
          node bin/dsh-developer.js run --source . --script test:development
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve current registry channel and exercise development
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "development-dsh-${{ matrix.dsh }}"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          pnpm --dir $runtime add --ignore-scripts --save-exact "@deepseek-ai/dsh@${{ matrix.dsh }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { 'dsh.cmd' } else { 'dsh' }
          $env:DSH_DEVELOPER_DSH = Join-Path $runtime "node_modules/.bin/$bin"
          $manifest = Get-Content -Raw (Join-Path $runtime 'node_modules/@deepseek-ai/dsh/package.json') | ConvertFrom-Json
          Write-Output "Registry channel ${{ matrix.dsh }} resolved to DSH $($manifest.version)"
          npm run typecheck -- --runtime $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node bin/dsh-developer.js run --source . --script test:development:dsh --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
